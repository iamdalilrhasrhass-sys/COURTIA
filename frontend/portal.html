<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0F172A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="COURTIA" />
  <link rel="manifest" href="/portail/manifest.json" />
  <link rel="apple-touch-icon" href="/portail/icon-192.png" />
  <title>COURTIA — Espace client</title>
  <style>
    html, body, #portal-root { background: #0B1120; min-height: 100vh; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  </style>
</head>
<body>
  <div id="portal-root"></div>
  <script type="module" src="/src/portal/main.jsx"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/portail/service-worker.js', { scope: '/portail' }).catch(console.error);
      });
    }
  </script>
</body>
</html>
