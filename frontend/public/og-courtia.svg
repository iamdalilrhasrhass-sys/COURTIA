<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#050510"/>
    </radialGradient>
    <radialGradient id="bubble" cx="35%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="15%" stop-color="#e0f0ff"/>
      <stop offset="35%" stop-color="#b8d4f8"/>
      <stop offset="55%" stop-color="#c4b5fd"/>
      <stop offset="78%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.6"/>
    </radialGradient>
    <linearGradient id="aurora1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Aurora waves background -->
  <ellipse cx="300" cy="200" rx="500" ry="300" fill="url(#aurora1)" opacity="0.6"/>
  <ellipse cx="900" cy="450" rx="450" ry="250" fill="url(#aurora1)" opacity="0.4"/>

  <!-- Aurora Bubble C -->
  <g transform="translate(600, 240)">
    <circle cx="0" cy="0" r="80" fill="url(#bubble)" filter="url(#glow)" opacity="0.92"/>
    <circle cx="0" cy="0" r="78" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <circle cx="-15" cy="-20" r="18" fill="white" opacity="0.2"/>
    <!-- C cutout effect -->
    <path d="M 20,-30 A 50,50 0 1,0 20,30" fill="none" stroke="rgba(0,0,0,0.15)" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <text x="600" y="370" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="52" font-weight="800" fill="url(#wordmark)" letter-spacing="-1">
    courtia.
  </text>

  <!-- Tagline -->
  <text x="600" y="420" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.55)" letter-spacing="-0.3">
    Le cockpit IA des courtiers
  </text>

  <!-- Subtitle -->
  <text x="600" y="470" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="400" fill="rgba(255,255,255,0.3)">
    CRM · ARK Intelligence · Portefeuille vivant · Relances intelligentes
  </text>

  <!-- Bottom line -->
  <line x1="450" y1="510" x2="750" y2="510" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="600" y="545" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.15)">
    courtiark.fr
  </text>
</svg>
