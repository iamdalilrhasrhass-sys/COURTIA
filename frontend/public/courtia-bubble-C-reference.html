<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Courtia — La Bulle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500&family=Fraunces:opsz,wght@9..144,300&family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --bg-deep:#020108;
  --bg-mid:#08051A;
}

*{box-sizing:border-box;margin:0;padding:0;}
html,body{
  background:var(--bg-deep);
  color:#fff;
  font-family:'Plus Jakarta Sans',sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
  height:100vh;
  width:100vw;
}

/* ─── COSMIC BACKGROUND ─── */
.cosmos{
  position:fixed;
  inset:0;
  background:
    radial-gradient(ellipse at 25% 30%, rgba(120,60,255,0.18) 0%, transparent 50%),
    radial-gradient(ellipse at 75% 70%, rgba(255,80,180,0.12) 0%, transparent 55%),
    radial-gradient(ellipse at 50% 100%, rgba(0,200,255,0.08) 0%, transparent 60%),
    linear-gradient(180deg, #020108 0%, #08051A 50%, #060211 100%);
  z-index:0;
}

/* Subtle grid floor */
.floor{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%) perspective(800px) rotateX(70deg);
  width:140vw;
  height:60vh;
  background-image:
    linear-gradient(rgba(180,100,255,0.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(180,100,255,0.06) 1px, transparent 1px);
  background-size:60px 60px;
  mask-image:linear-gradient(to top, black 0%, transparent 80%);
  -webkit-mask-image:linear-gradient(to top, black 0%, transparent 80%);
  z-index:0;
}

/* Floating particles */
.particles{position:fixed;inset:0;z-index:1;pointer-events:none;}
.particle{
  position:absolute;
  width:2px;height:2px;
  background:#fff;
  border-radius:50%;
  opacity:0;
  animation:drift linear infinite;
}
@keyframes drift{
  0%{transform:translateY(100vh) translateX(0);opacity:0;}
  10%{opacity:0.6;}
  90%{opacity:0.6;}
  100%{transform:translateY(-10vh) translateX(40px);opacity:0;}
}

/* ─── STAGE ─── */
.stage{
  position:relative;
  z-index:2;
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:40px;
}

.kicker{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;
  letter-spacing:6px;
  text-transform:uppercase;
  color:rgba(255,255,255,0.4);
  margin-bottom:60px;
}
.kicker .dot{
  display:inline-block;
  width:6px;height:6px;
  border-radius:50%;
  background:linear-gradient(135deg,#ff4d9d,#a142f4);
  margin:0 10px;
  vertical-align:middle;
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{opacity:0.5;transform:scale(1);}
  50%{opacity:1;transform:scale(1.4);}
}

/* THE BUBBLE C */
.bubble-wrap{
  position:relative;
  width:min(520px,75vw);
  aspect-ratio:1/1;
  margin-bottom:50px;
}

/* Outer halo glow */
.bubble-halo{
  position:absolute;
  inset:-10%;
  background:
    radial-gradient(circle at 30% 30%, rgba(255,100,200,0.25) 0%, transparent 40%),
    radial-gradient(circle at 70% 60%, rgba(100,200,255,0.2) 0%, transparent 45%),
    radial-gradient(circle at 50% 80%, rgba(180,100,255,0.18) 0%, transparent 50%);
  filter:blur(50px);
  animation:halo-shift 8s ease-in-out infinite;
  z-index:-1;
}
@keyframes halo-shift{
  0%,100%{transform:scale(1) rotate(0deg);opacity:0.8;}
  50%{transform:scale(1.15) rotate(180deg);opacity:1;}
}

.bubble{
  width:100%;
  height:100%;
  position:relative;
  animation:breathe 7s ease-in-out infinite;
}
@keyframes breathe{
  0%,100%{transform:scale(1) translateY(0);}
  50%{transform:scale(1.025) translateY(-6px);}
}

.bubble svg{width:100%;height:100%;display:block;overflow:visible;}

/* Floor reflection */
.reflection{
  position:absolute;
  bottom:-100%;
  left:0;right:0;
  height:100%;
  transform:scaleY(-1);
  opacity:0.18;
  filter:blur(8px);
  mask-image:linear-gradient(to top, black 0%, transparent 70%);
  -webkit-mask-image:linear-gradient(to top, black 0%, transparent 70%);
}

/* WORDMARK */
.wordmark{
  font-family:'Plus Jakarta Sans',sans-serif;
  font-weight:200;
  font-size:clamp(48px,8vw,82px);
  letter-spacing:-3px;
  line-height:1;
  background:linear-gradient(135deg, #fff 0%, rgba(255,255,255,0.7) 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  margin-bottom:14px;
}
.wordmark em{
  font-family:'Fraunces',serif;
  font-style:italic;
  font-weight:300;
  background:linear-gradient(90deg,#ff4d9d 0%,#a142f4 50%,#4285f4 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}

.tagline{
  font-family:'Instrument Serif',serif;
  font-style:italic;
  font-size:clamp(15px,1.6vw,18px);
  color:rgba(255,255,255,0.5);
  letter-spacing:-.2px;
  text-align:center;
  max-width:420px;
}

@media(max-width:600px){
  .kicker{margin-bottom:32px;font-size:9px;letter-spacing:4px;}
  .bubble-wrap{margin-bottom:32px;}
}
</style>
</head>
<body>

<div class="cosmos"></div>
<div class="floor"></div>

<div class="particles" id="particles"></div>

<div class="stage">

  <div class="kicker">Courtia <span class="dot"></span> L'IA Compagnon des Courtiers</div>

  <div class="bubble-wrap">
    <div class="bubble-halo"></div>
    <div class="bubble">

      <svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- ============================================ -->
          <!-- LIQUID FILTER — organic membrane deformation -->
          <!-- ============================================ -->
          <filter id="liquidFilm" x="-15%" y="-15%" width="130%" height="130%">
            <feTurbulence type="fractalNoise" baseFrequency="0.008" numOctaves="3" seed="7" result="noise">
              <animate attributeName="baseFrequency" values="0.008;0.014;0.008" dur="18s" repeatCount="indefinite"/>
              <animate attributeName="seed" values="7;25;7" dur="22s" repeatCount="indefinite"/>
            </feTurbulence>
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="6"/>
          </filter>

          <!-- Blur for halos -->
          <filter id="softBlur"><feGaussianBlur stdDeviation="2"/></filter>
          <filter id="hardBlur"><feGaussianBlur stdDeviation="6"/></filter>

          <!-- ============================================ -->
          <!-- IRIDESCENT GRADIENTS                          -->
          <!-- ============================================ -->

          <!-- Primary iris — animated rotation -->
          <linearGradient id="iris1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff80e0" stop-opacity="0.95"/>
            <stop offset="18%" stop-color="#c080ff" stop-opacity="0.95"/>
            <stop offset="36%" stop-color="#80a8ff" stop-opacity="0.95"/>
            <stop offset="54%" stop-color="#80f0d8" stop-opacity="0.95"/>
            <stop offset="72%" stop-color="#fff080" stop-opacity="0.95"/>
            <stop offset="90%" stop-color="#ff80b0" stop-opacity="0.95"/>
            <stop offset="100%" stop-color="#ff80e0" stop-opacity="0.95"/>
            <animateTransform attributeName="gradientTransform" type="rotate" from="0 0.5 0.5" to="360 0.5 0.5" dur="20s" repeatCount="indefinite"/>
          </linearGradient>

          <!-- Secondary iris — counter-rotation -->
          <linearGradient id="iris2" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#80ffe0" stop-opacity="0.7"/>
            <stop offset="33%" stop-color="#ff80c0" stop-opacity="0.7"/>
            <stop offset="66%" stop-color="#a080ff" stop-opacity="0.7"/>
            <stop offset="100%" stop-color="#ffd080" stop-opacity="0.7"/>
            <animateTransform attributeName="gradientTransform" type="rotate" from="360 0.5 0.5" to="0 0.5 0.5" dur="28s" repeatCount="indefinite"/>
          </linearGradient>

          <!-- Tertiary — slow shimmer -->
          <linearGradient id="iris3" x1="50%" y1="0%" x2="50%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
            <stop offset="40%" stop-color="#ffb0e8" stop-opacity="0.5"/>
            <stop offset="70%" stop-color="#a0c8ff" stop-opacity="0.5"/>
            <stop offset="100%" stop-color="#80ffd0" stop-opacity="0.4"/>
            <animateTransform attributeName="gradientTransform" type="rotate" from="0 0.5 0.5" to="-360 0.5 0.5" dur="35s" repeatCount="indefinite"/>
          </linearGradient>

          <!-- Inner transparency / membrane interior -->
          <radialGradient id="membrane" cx="40%" cy="40%" r="60%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
            <stop offset="60%" stop-color="#ffffff" stop-opacity="0.04"/>
            <stop offset="92%" stop-color="#ffd0ff" stop-opacity="0.18"/>
            <stop offset="100%" stop-color="#a080ff" stop-opacity="0.35"/>
          </radialGradient>

          <!-- Specular hot-spot -->
          <radialGradient id="spec1" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
            <stop offset="40%" stop-color="#ffffff" stop-opacity="0.4"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
          </radialGradient>

          <radialGradient id="spec2" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
          </radialGradient>

          <!-- Rim light -->
          <linearGradient id="rim" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
            <stop offset="50%" stop-color="#ffffff" stop-opacity="0.3"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0.6"/>
          </linearGradient>

          <!-- ============================================ -->
          <!-- THE C MASK — used to clip everything to a C  -->
          <!-- ============================================ -->
          <clipPath id="cClip">
            <path d="
              M 473 200
              A 200 200 0 1 0 473 400
              L 413 365
              A 130 130 0 1 1 413 235
              Z
            "/>
          </clipPath>
        </defs>

        <!-- ============================================ -->
        <!-- LAYER 0 — Outer iridescent halo (behind)     -->
        <!-- ============================================ -->
        <path d="
          M 473 200
          A 200 200 0 1 0 473 400
          L 413 365
          A 130 130 0 1 1 413 235
          Z
        " fill="url(#iris1)" opacity="0.4" filter="url(#hardBlur)" transform="scale(1.08) translate(-22,-22)"/>

        <!-- ============================================ -->
        <!-- LAYER 1 — Main C body (iridescent membrane)  -->
        <!-- ============================================ -->
        <g filter="url(#liquidFilm)">
          <!-- Base iris fill -->
          <path d="
            M 473 200
            A 200 200 0 1 0 473 400
            L 413 365
            A 130 130 0 1 1 413 235
            Z
          " fill="url(#iris1)" opacity="0.55"/>

          <!-- Layer 2 iris with screen blend feel -->
          <path d="
            M 473 200
            A 200 200 0 1 0 473 400
            L 413 365
            A 130 130 0 1 1 413 235
            Z
          " fill="url(#iris2)" opacity="0.45" style="mix-blend-mode:screen"/>

          <!-- Layer 3 — soft shimmer -->
          <path d="
            M 473 200
            A 200 200 0 1 0 473 400
            L 413 365
            A 130 130 0 1 1 413 235
            Z
          " fill="url(#iris3)" opacity="0.4" style="mix-blend-mode:overlay"/>

          <!-- Membrane interior (soft transparency) -->
          <path d="
            M 473 200
            A 200 200 0 1 0 473 400
            L 413 365
            A 130 130 0 1 1 413 235
            Z
          " fill="url(#membrane)"/>
        </g>

        <!-- ============================================ -->
        <!-- LAYER 2 — Outer & inner edge highlights       -->
        <!-- ============================================ -->
        <!-- Outer edge of C (bright iridescent rim) -->
        <path d="M 473 200 A 200 200 0 1 0 473 400" 
              fill="none" stroke="url(#iris1)" stroke-width="3" opacity="0.95"/>
        <!-- Outer edge sharp white rim -->
        <path d="M 473 200 A 200 200 0 1 0 473 400" 
              fill="none" stroke="white" stroke-width="1.2" opacity="0.6"/>

        <!-- Inner edge of C -->
        <path d="M 413 235 A 130 130 0 1 1 413 365" 
              fill="none" stroke="url(#iris2)" stroke-width="2.5" opacity="0.9"/>
        <path d="M 413 235 A 130 130 0 1 1 413 365" 
              fill="none" stroke="white" stroke-width="1" opacity="0.5"/>

        <!-- Right-edge connectors (top and bottom of C opening) -->
        <line x1="473" y1="200" x2="413" y2="235" stroke="url(#iris1)" stroke-width="2.5" opacity="0.85"/>
        <line x1="473" y1="400" x2="413" y2="365" stroke="url(#iris1)" stroke-width="2.5" opacity="0.85"/>

        <!-- ============================================ -->
        <!-- LAYER 3 — Specular highlights (the windows)  -->
        <!-- ============================================ -->
        <g clip-path="url(#cClip)">
          <!-- Big top-left window -->
          <ellipse cx="170" cy="220" rx="55" ry="90" 
                   fill="url(#spec1)" 
                   transform="rotate(-25 170 220)" opacity="0.85"/>

          <!-- Mid-left smaller highlight -->
          <ellipse cx="140" cy="320" rx="22" ry="55" 
                   fill="url(#spec2)" opacity="0.6"/>

          <!-- Bottom-left soft window -->
          <ellipse cx="200" cy="430" rx="40" ry="25" 
                   fill="url(#spec2)"
                   transform="rotate(15 200 430)" opacity="0.5"/>

          <!-- Tiny sparkle top -->
          <circle cx="150" cy="190" r="3" fill="white" opacity="0.95"/>
          <circle cx="150" cy="190" r="8" fill="white" opacity="0.3" filter="url(#softBlur)"/>

          <!-- Tiny sparkle middle -->
          <circle cx="120" cy="330" r="2" fill="white" opacity="0.9"/>
          <circle cx="120" cy="330" r="5" fill="white" opacity="0.25" filter="url(#softBlur)"/>
        </g>

        <!-- ============================================ -->
        <!-- LAYER 4 — Bubble foam cluster (top of C)      -->
        <!-- ============================================ -->
        <g opacity="0.92">
          <!-- Larger foam bubble -->
          <circle cx="445" cy="155" r="22" 
                  fill="url(#membrane)" stroke="url(#iris1)" stroke-width="1.5" opacity="0.85"/>
          <ellipse cx="438" cy="148" rx="6" ry="4" fill="white" opacity="0.7"/>

          <!-- Medium foam bubble -->
          <circle cx="478" cy="135" r="16" 
                  fill="url(#membrane)" stroke="url(#iris2)" stroke-width="1.2" opacity="0.85"/>
          <ellipse cx="473" cy="130" rx="4" ry="3" fill="white" opacity="0.65"/>

          <!-- Small foam bubble -->
          <circle cx="420" cy="138" r="11" 
                  fill="url(#membrane)" stroke="url(#iris1)" stroke-width="1" opacity="0.8"/>
          <ellipse cx="417" cy="135" rx="3" ry="2" fill="white" opacity="0.6"/>

          <!-- Tiny foam bubble -->
          <circle cx="500" cy="158" r="7" 
                  fill="url(#membrane)" stroke="white" stroke-width="0.8" opacity="0.7"/>

          <!-- Micro foam bubble -->
          <circle cx="460" cy="120" r="5" 
                  fill="url(#membrane)" stroke="white" stroke-width="0.6" opacity="0.6"/>
        </g>

        <!-- ============================================ -->
        <!-- LAYER 5 — Final top rim light (the "kiss")  -->
        <!-- ============================================ -->
        <path d="M 200 180 A 180 180 0 0 1 350 130" 
              fill="none" stroke="white" stroke-width="2" opacity="0.4" filter="url(#softBlur)"/>
      </svg>

    </div>
  </div>

  <h1 class="wordmark">courtia<em>.</em></h1>
  <p class="tagline">Une bulle d'intelligence pour celui qui protège.</p>

</div>

<script>
// Floating particles
const particlesContainer = document.getElementById('particles');
for(let i = 0; i < 35; i++){
  const p = document.createElement('div');
  p.className = 'particle';
  p.style.left = Math.random() * 100 + 'vw';
  p.style.animationDuration = (10 + Math.random() * 20) + 's';
  p.style.animationDelay = (Math.random() * -20) + 's';
  p.style.opacity = 0.3 + Math.random() * 0.5;
  particlesContainer.appendChild(p);
}
</script>

</body>
</html>
