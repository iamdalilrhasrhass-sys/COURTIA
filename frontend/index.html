<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <!-- Primary Meta
         Ce shell est servi pour TOUTES les routes du SPA : ce title, cette
         description et ce canonical sont le socle, puis chaque route publique
         les remplace côté client via applySeo (src/lib/seo.js). Sans ce
         mécanisme, /tarifs, /contact, /login… héritaient tous du même
         title/canonical — duplication constatée en production. -->
    <title>COURTIA — Le cockpit IA des courtiers d’assurance</title>
    <meta name="description" content="COURTIA centralise clients, contrats, relances, commissions et conformité des courtiers d’assurance, en France (DDA · ORIAS · RGPD) comme en Suisse (LSA · FINMA · nLPD).">
    <meta name="author" content="COURTIA">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#050510" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#050510">
    <meta name="background-color" content="#050510">
    <link rel="canonical" href="https://courtiark.fr/">

    <!-- PWA iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="COURTIA">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="COURTIA">
    <meta name="format-detection" content="telephone=no">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">

    <!-- Open Graph -->
    <meta property="og:title" content="COURTIA — Le cockpit IA des courtiers d’assurance">
    <meta property="og:description" content="Clients, contrats, échéances, commissions et conformité des courtiers d’assurance, en France (DDA · ORIAS · RGPD) et en Suisse (LSA · FINMA · nLPD).">
    <meta property="og:image" content="https://courtiark.fr/og-courtia.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="COURTIA — Le cockpit IA des courtiers d’assurance">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://courtiark.fr/">
    <meta property="og:locale" content="fr_FR">
    <meta property="og:site_name" content="COURTIA">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="COURTIA — Le cockpit IA des courtiers d’assurance">
    <meta name="twitter:description" content="Clients, contrats, échéances, commissions et conformité des courtiers d’assurance, en France et en Suisse.">
    <meta name="twitter:image" content="https://courtiark.fr/og-courtia.png">
    <meta name="twitter:image:alt" content="COURTIA — Le cockpit IA des courtiers d’assurance">

    <!-- Données structurées d'identité (valables sur toutes les routes du shell) :
         éditeur et site. Aucune adresse, aucun avis, aucune note : COURTIA
         n'expose pas d'établissement public et nous n'inventons pas d'avis. -->
    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Organization","name":"COURTIA","url":"https://courtiark.fr","logo":"https://courtiark.fr/og-courtia.png","email":"contact@courtiark.fr","description":"COURTIA est un logiciel de gestion et cockpit d'assistance IA destiné aux courtiers d'assurance.","areaServed":[{"@type":"Country","name":"France"},{"@type":"Country","name":"Suisse"}]}</script>
    <script type="application/ld+json">{"@context":"https://schema.org","@type":"WebSite","name":"COURTIA","url":"https://courtiark.fr","inLanguage":"fr"}</script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300;1,9..144,400&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
