<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Courtia — La Bulle V2 PHOTO-RÉALISTE — RÉFÉRENCE ABSOLUE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500&family=Fraunces:opsz,wght@9..144,300&family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{
  background:#020108;
  color:#fff;
  font-family:'Plus Jakarta Sans',sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
  height:100vh;width:100vw;
  position:fixed;
}

/* ─── BACKGROUND TRÈS DISCRET ─── */
.cosmos{
position:fixed;inset:0;z-index:0;
background:
radial-gradient(ellipse at 50% 45%, rgba(90,40,180,0.10) 0%, transparent 50%),
radial-gradient(ellipse at 30% 80%, rgba(220,60,160,0.05) 0%, transparent 55%),
linear-gradient(180deg, #020108 0%, #06031A 50%, #020108 100%);
}

/* Étoiles fines et rares */
.stars{position:fixed;inset:0;z-index:1;pointer-events:none;}
.star{
position:absolute;
background:#fff;
border-radius:50%;
animation:twinkle ease-in-out infinite;
}
@keyframes twinkle{
0%,100%{opacity:0.08;}
50%{opacity:0.45;}
}

/* ─── STAGE ─── */
.stage{
position:fixed;
inset:0;
z-index:2;
display:flex;
flex-direction:column;
align-items:center;
justify-content:space-between;
padding:42px;
pointer-events:none;
}

.kicker{
font-family:'JetBrains Mono',monospace;
font-size:10px;
letter-spacing:7px;
text-transform:uppercase;
color:rgba(255,255,255,0.38);
margin-top:10px;
display:flex;align-items:center;gap:14px;
opacity:0;animation:fade-in 1.5s 0.6s forwards;
}
.kicker .pulse-dot{
display:inline-block;width:5px;height:5px;
border-radius:50%;
background:linear-gradient(135deg,#ff4d9d,#a142f4);
box-shadow:0 0 6px rgba(255,77,157,0.6);
animation:pulse 2.4s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:0.5;transform:scale(1);}50%{opacity:1;transform:scale(1.4);}}
@keyframes fade-in{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* ─── BUBBLE WRAPPER ─── */
.bubble-frame{
flex:1;
display:flex;
align-items:center;
justify-content:center;
width:100%;
max-width:560px;
margin:0 auto;
padding:0 20px;
}
.bubble-wrap{
width:100%;
max-width:480px;
aspect-ratio:1/1;
position:relative;
opacity:0;
animation:bubble-in 1.8s 0.3s cubic-bezier(.2,.7,.3,1) forwards;
}
@keyframes bubble-in{
from{opacity:0;transform:scale(0.85);}
to{opacity:1;transform:scale(1);}
}
.bubble-wrap svg{
width:100%;
height:100%;
display:block;
filter:drop-shadow(0 30px 60px rgba(140,60,220,0.25));
animation:breathe 7s ease-in-out infinite;
}
@keyframes breathe{
0%,100%{transform:scale(1) translateY(0);}
50%{transform:scale(1.018) translateY(-4px);}
}

/* ─── TEXTE BOTTOM ─── */
.bottom-block{
text-align:center;
margin-bottom:24px;
opacity:0;animation:fade-in 1.5s 1.3s forwards;
}
.wordmark{
font-family:'Plus Jakarta Sans',sans-serif;
font-weight:200;
font-size:clamp(46px,7vw,72px);
letter-spacing:-3px;
line-height:1;
background:linear-gradient(135deg, #fff 0%, rgba(255,255,255,0.65) 100%);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
background-clip:text;
margin-bottom:14px;
}
.wordmark em{
font-family:'Fraunces',serif;
font-style:italic;
font-weight:300;
background:linear-gradient(90deg,#ff4d9d 0%,#a142f4 50%,#4285f4 100%);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
background-clip:text;
}
.tagline{
font-family:'Instrument Serif',serif;
font-style:italic;
font-size:clamp(14px,1.5vw,18px);
color:rgba(255,255,255,0.52);
letter-spacing:-.1px;
max-width:440px;
margin:0 auto;
}

@media(max-width:600px){
.stage{padding:24px;}
.bubble-frame{padding:0;}
}
</style>
</head>
<body>

<div class="cosmos"></div>
<div class="stars" id="stars"></div>

<div class="stage">
  <div class="kicker">Courtia <span class="pulse-dot"></span> L'IA Compagnon</div>

  <div class="bubble-frame">
    <div class="bubble-wrap">
  <svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="b2"><feGaussianBlur stdDeviation="2"/></filter>
      <filter id="b4"><feGaussianBlur stdDeviation="4"/></filter>
      <filter id="b8"><feGaussianBlur stdDeviation="8"/></filter>
      <filter id="b18"><feGaussianBlur stdDeviation="18"/></filter>

      <linearGradient id="rimIris" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFB0E0"/>
        <stop offset="14%" stop-color="#E090FF"/>
        <stop offset="28%" stop-color="#A080FF"/>
        <stop offset="42%" stop-color="#80B0FF"/>
        <stop offset="56%" stop-color="#80EDFF"/>
        <stop offset="70%" stop-color="#A8F8C0"/>
        <stop offset="84%" stop-color="#FFE890"/>
        <stop offset="100%" stop-color="#FFA8D0"/>
        <animateTransform attributeName="gradientTransform" type="rotate" from="0 0.5 0.5" to="360 0.5 0.5" dur="30s" repeatCount="indefinite"/>
      </linearGradient>

      <linearGradient id="rimIris2" x1="100%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#80FFE0" stop-opacity="0.85"/>
        <stop offset="25%" stop-color="#FFB0E0" stop-opacity="0.85"/>
        <stop offset="50%" stop-color="#B080FF" stop-opacity="0.85"/>
        <stop offset="75%" stop-color="#80C8FF" stop-opacity="0.85"/>
        <stop offset="100%" stop-color="#FFE8A0" stop-opacity="0.85"/>
        <animateTransform attributeName="gradientTransform" type="rotate" from="360 0.5 0.5" to="0 0.5 0.5" dur="45s" repeatCount="indefinite"/>
      </linearGradient>

      <radialGradient id="membrane" cx="40%" cy="38%" r="60%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
        <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.04"/>
        <stop offset="85%" stop-color="#E8C0FF" stop-opacity="0.12"/>
        <stop offset="100%" stop-color="#B080FF" stop-opacity="0.22"/>
      </radialGradient>

      <radialGradient id="patchPink" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FFB0E0" stop-opacity="0.55"/>
        <stop offset="60%" stop-color="#FFB0E0" stop-opacity="0.15"/>
        <stop offset="100%" stop-color="#FFB0E0" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="patchPurple" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#C080FF" stop-opacity="0.6"/>
        <stop offset="60%" stop-color="#C080FF" stop-opacity="0.15"/>
        <stop offset="100%" stop-color="#C080FF" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="patchBlue" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#80B0FF" stop-opacity="0.55"/>
        <stop offset="60%" stop-color="#80B0FF" stop-opacity="0.12"/>
        <stop offset="100%" stop-color="#80B0FF" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="patchCyan" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#80FFE8" stop-opacity="0.5"/>
        <stop offset="60%" stop-color="#80FFE8" stop-opacity="0.12"/>
        <stop offset="100%" stop-color="#80FFE8" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="patchYellow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FFE890" stop-opacity="0.4"/>
        <stop offset="60%" stop-color="#FFE890" stop-opacity="0.1"/>
        <stop offset="100%" stop-color="#FFE890" stop-opacity="0"/>
      </radialGradient>

      <radialGradient id="specMain" cx="50%" cy="40%" r="55%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
        <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.65"/>
        <stop offset="75%" stop-color="#FFFFFF" stop-opacity="0.2"/>
        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="specSoft" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"/>
        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
      </radialGradient>

      <radialGradient id="foamBody" cx="40%" cy="35%" r="60%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/>
        <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.05"/>
        <stop offset="100%" stop-color="#E8C0FF" stop-opacity="0.25"/>
      </radialGradient>

      <linearGradient id="foamRim" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFB0E0"/>
        <stop offset="33%" stop-color="#B080FF"/>
        <stop offset="66%" stop-color="#80D0FF"/>
        <stop offset="100%" stop-color="#A0FFC0"/>
        <animateTransform attributeName="gradientTransform" type="rotate" from="0 0.5 0.5" to="360 0.5 0.5" dur="20s" repeatCount="indefinite"/>
      </linearGradient>

      <path id="cPath" d="M 477 208 A 200 200 0 1 0 477 392 L 416 357 A 130 130 0 1 1 416 243 Z"/>
      <clipPath id="cClip"><use href="#cPath"/></clipPath>
    </defs>

    <!-- L0 : HALO IRIDESCENT DERRIÈRE -->
    <g transform="translate(300,300) scale(1.18) translate(-300,-300)" filter="url(#b18)" opacity="0.55">
      <use href="#cPath" fill="url(#rimIris)"/>
    </g>

    <!-- L1 : MEMBRANE INTÉRIEURE -->
    <use href="#cPath" fill="url(#membrane)"/>

    <!-- L2 : PATCHES IRIDESCENTES PASTEL -->
    <g clip-path="url(#cClip)" style="mix-blend-mode:screen">
      <ellipse cx="150" cy="200" rx="90" ry="120" fill="url(#patchPink)" transform="rotate(-20 150 200)"/>
      <ellipse cx="130" cy="310" rx="75" ry="100" fill="url(#patchPurple)"/>
      <ellipse cx="170" cy="420" rx="85" ry="70" fill="url(#patchBlue)" transform="rotate(15 170 420)"/>
      <ellipse cx="230" cy="470" rx="60" ry="40" fill="url(#patchCyan)"/>
      <ellipse cx="380" cy="170" rx="50" ry="60" fill="url(#patchYellow)"/>
    </g>

    <!-- L3 : BORD EXTÉRIEUR -->
    <path d="M 477 208 A 200 200 0 1 0 477 392" fill="none" stroke="url(#rimIris)" stroke-width="3.5" opacity="0.95"/>
    <path d="M 477 208 A 200 200 0 1 0 477 392" fill="none" stroke="url(#rimIris2)" stroke-width="2" opacity="0.7" style="mix-blend-mode:screen"/>
    <path d="M 477 208 A 200 200 0 1 0 477 392" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.85"/>

    <!-- L4 : BORD INTÉRIEUR -->
    <path d="M 416 243 A 130 130 0 1 1 416 357" fill="none" stroke="url(#rimIris2)" stroke-width="3" opacity="0.9"/>
    <path d="M 416 243 A 130 130 0 1 1 416 357" fill="none" stroke="url(#rimIris)" stroke-width="1.5" opacity="0.6" style="mix-blend-mode:screen"/>
    <path d="M 416 243 A 130 130 0 1 1 416 357" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.7"/>

    <!-- L5 : CONNECTEURS -->
    <line x1="477" y1="208" x2="416" y2="243" stroke="url(#rimIris)" stroke-width="3" opacity="0.92"/>
    <line x1="477" y1="208" x2="416" y2="243" stroke="#ffffff" stroke-width="0.9" opacity="0.7"/>
    <line x1="477" y1="392" x2="416" y2="357" stroke="url(#rimIris)" stroke-width="3" opacity="0.92"/>
    <line x1="477" y1="392" x2="416" y2="357" stroke="#ffffff" stroke-width="0.9" opacity="0.7"/>

    <!-- L6 : SPECULAR HIGHLIGHTS -->
    <g clip-path="url(#cClip)">
      <ellipse cx="175" cy="230" rx="62" ry="105" fill="url(#specMain)" transform="rotate(-22 175 230)" opacity="0.85"/>
      <ellipse cx="135" cy="340" rx="28" ry="65" fill="url(#specSoft)" transform="rotate(-5 135 340)" opacity="0.55"/>
      <ellipse cx="205" cy="440" rx="42" ry="22" fill="url(#specSoft)" transform="rotate(20 205 440)" opacity="0.5"/>
      <ellipse cx="410" cy="270" rx="12" ry="22" fill="url(#specSoft)" opacity="0.4"/>
      <g>
        <circle cx="148" cy="185" r="4" fill="#FFFFFF" opacity="0.95"/>
        <circle cx="148" cy="185" r="11" fill="#FFFFFF" opacity="0.35" filter="url(#b2)"/>
        <circle cx="115" cy="295" r="2.5" fill="#FFFFFF" opacity="0.9"/>
        <circle cx="115" cy="295" r="7" fill="#FFFFFF" opacity="0.3" filter="url(#b2)"/>
        <circle cx="220" cy="490" r="2" fill="#FFFFFF" opacity="0.85"/>
        <circle cx="220" cy="490" r="5" fill="#FFFFFF" opacity="0.25" filter="url(#b2)"/>
      </g>
      <path d="M 195 175 A 165 165 0 0 1 340 142" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.45" filter="url(#b2)"/>
      <path d="M 200 178 A 155 155 0 0 1 320 152" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.85"/>
    </g>

    <!-- L7 : MICRO-BULLES INTÉRIEURES -->
    <g clip-path="url(#cClip)" opacity="0.85">
      <circle cx="270" cy="280" r="3.5" fill="url(#foamBody)" stroke="url(#foamRim)" stroke-width="0.8"/>
      <circle cx="200" cy="370" r="2.5" fill="url(#foamBody)" stroke="url(#foamRim)" stroke-width="0.6"/>
      <circle cx="320" cy="395" r="2" fill="url(#foamBody)" stroke="url(#foamRim)" stroke-width="0.5"/>
      <circle cx="160" cy="270" r="1.8" fill="#FFFFFF" opacity="0.6"/>
      <circle cx="380" cy="330" r="1.5" fill="#FFFFFF" opacity="0.5"/>
    </g>

    <!-- L8 : FOAM CLUSTER 8 BULLES -->
    <g>
      <g transform="translate(450,150)">
        <circle r="26" fill="url(#foamBody)" stroke="url(#foamRim)" stroke-width="1.8" opacity="0.95"/>
        <ellipse cx="-7" cy="-10" rx="9" ry="6" fill="#FFFFFF" opacity="0.75" transform="rotate(-30 -7 -10)"/>
        <circle cx="-9" cy="-12" r="2" fill="#FFFFFF" opacity="0.95"/>
        <path d="M -18 -5 A 22 22 0 0 1 -2 -22" fill="none" stroke="#FFFFFF" stroke-width="0.8" opacity="0.6"/>
      </g>
      <g transform="translate(490,118)">
        <circle r="18" fill="url(#foamBody)" stroke="url(#foamRim)" stroke-width="1.4" opacity="0.92"/>
        <ellipse cx="-5" cy="-7" rx="6" ry="4" fill="#FFFFFF" opacity="0.7" transform="rotate(-30 -5 -7)"/>
        <circle cx="-6" cy="-8" r="1.5" fill="#FFFFFF" opacity="0.9"/>
      </g>
      <g transform="translate(420,118)">
        <circle r="14" fill="url(#foamBody)" stroke="url(#foamRim)" stroke-width="1.2" opacity="0.9"/>
        <ellipse cx="-4" cy="-5" rx="4.5" ry="3" fill="#FFFFFF" opacity="0.65" transform="rotate(-30 -4 -5)"/>
        <circle cx="-5" cy="-6" r="1.2" fill="#FFFFFF" opacity="0.85"/>
      </g>
      <g transform="translate(510,165)">
        <circle r="11" fill="url(#foamBody)" stroke="url(#foamRim)" stroke-width="1" opacity="0.88"/>
        <ellipse cx="-3" cy="-4" rx="3.5" ry="2.5" fill="#FFFFFF" opacity="0.6" transform="rotate(-30 -3 -4)"/>
        <circle cx="-3.5" cy="-4.5" r="1" fill="#FFFFFF" opacity="0.8"/>
      </g>
      <g transform="translate(460,95)">
        <circle r="9" fill="url(#foamBody)" stroke="url(#foamRim)" stroke-width="0.9" opacity="0.85"/>
        <ellipse cx="-2.5" cy="-3" rx="3" ry="2" fill="#FFFFFF" opacity="0.55" transform="rotate(-30 -2.5 -3)"/>
        <circle cx="-3" cy="-3.5" r="0.8" fill="#FFFFFF" opacity="0.75"/>
      </g>
      <g transform="translate(395,142)">
        <circle r="7" fill="url(#foamBody)" stroke="url(#foamRim)" stroke-width="0.8" opacity="0.82"/>
        <ellipse cx="-2" cy="-2.5" rx="2.5" ry="1.5" fill="#FFFFFF" opacity="0.55"/>
      </g>
      <g transform="translate(530,135)">
        <circle r="5" fill="url(#foamBody)" stroke="url(#foamRim)" stroke-width="0.7" opacity="0.78"/>
        <circle cx="-1.5" cy="-2" r="1" fill="#FFFFFF" opacity="0.6"/>
      </g>
      <g transform="translate(508,90)">
        <circle r="3" fill="url(#foamBody)" stroke="#FFFFFF" stroke-width="0.5" opacity="0.7"/>
      </g>
    </g>

    <!-- L9 : ÉTINCELLE FINALE MAGIQUE -->
    <g>
      <circle cx="455" cy="142" r="2.5" fill="#FFFFFF" opacity="1"/>
      <circle cx="455" cy="142" r="8" fill="#FFFFFF" opacity="0.35" filter="url(#b4)"/>
      <circle cx="455" cy="142" r="16" fill="#FFB0E0" opacity="0.18" filter="url(#b8)"/>
    </g>
  </svg>
    </div>
  </div>

  <div class="bottom-block">
    <h1 class="wordmark">courtia<em>.</em></h1>
    <p class="tagline">Une bulle d'intelligence pour celui qui protège.</p>
  </div>
</div>

<script>
const starsContainer = document.getElementById('stars');
for(let i = 0; i < 40; i++){
  const s = document.createElement('div');
  s.className = 'star';
  const size = 0.5 + Math.random() * 1.2;
  s.style.width = size + 'px';
  s.style.height = size + 'px';
  s.style.left = Math.random() * 100 + 'vw';
  s.style.top = Math.random() * 100 + 'vh';
  s.style.animationDuration = (3 + Math.random() * 5) + 's';
  s.style.animationDelay = (Math.random() * -7) + 's';
  starsContainer.appendChild(s);
}
</script>
</body>
</html>
