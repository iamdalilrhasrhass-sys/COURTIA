<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="0; url=/" />
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="https://courtiark.fr/" />
  <title>COURTIA — Redirection</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050510;
      --text: #f5f3ff;
      --muted: #b8b7cf;
      --violet: #8b5cf6;
      --cyan: #22d3ee;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 30% 30%, rgba(139, 92, 246, 0.34), transparent 34rem),
        radial-gradient(circle at 70% 62%, rgba(34, 211, 238, 0.18), transparent 32rem),
        var(--bg);
    }

    .card {
      width: min(92vw, 560px);
      padding: 38px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 32px;
      background: rgba(10, 11, 28, 0.72);
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.45), 0 0 70px rgba(139, 92, 246, 0.22);
      backdrop-filter: blur(22px);
    }

    .sigil {
      width: 74px;
      height: 74px;
      margin: 0 auto 22px;
      border-radius: 999px;
      background: conic-gradient(from 130deg, rgba(34, 211, 238, 0.9), rgba(139, 92, 246, 0.96), rgba(245, 243, 255, 0.88), rgba(34, 211, 238, 0.9));
      box-shadow: 0 0 44px rgba(139, 92, 246, 0.45);
      mask: radial-gradient(circle at 62% 50%, transparent 30%, #000 31%);
    }

    h1 { margin: 0 0 12px; font-size: clamp(2rem, 6vw, 3.25rem); letter-spacing: -0.06em; }
    p { margin: 0 0 24px; color: var(--muted); line-height: 1.65; }
    a { color: var(--text); text-decoration: none; }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 22px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--violet), #6d5dfb 55%, var(--cyan));
      font-weight: 800;
      box-shadow: 0 18px 52px rgba(139, 92, 246, 0.32);
    }
  </style>
</head>
<body>
  <main class="card" aria-labelledby="title">
    <div class="sigil" aria-hidden="true"></div>
    <h1 id="title">COURTIA a évolué.</h1>
    <p>La landing officielle est désormais servie par le cockpit Aurora de production. Redirection vers courtiark.fr.</p>
    <a class="button" href="/">Ouvrir la landing COURTIA</a>
  </main>
</body>
</html>
